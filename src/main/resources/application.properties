spring.application.name=update-tracker
server.port=8080
spring.datasource.url=jdbc:h2:mem:updatetracker;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-please
app.jwt.expiration-ms=86400000
logging.level.org.springframework.security=DEBUG
